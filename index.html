<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Quản Lý Cá Nhân"/>
<title>Quản Lý Cá Nhân</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
#root{height:100vh;overflow:hidden;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#2a2a3a;border-radius:2px;}
input,textarea,select{font-family:'Be Vietnam Pro',sans-serif;outline:none;}
button{font-family:'Be Vietnam Pro',sans-serif;}
@keyframes slideIn{from{transform:translateX(120px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:640px){
  .sidebar{width:60px!important;}
  .sidebar .label{display:none!important;}
  .sidebar .logo-text{display:none!important;}
  .sidebar .logo-icon{font-size:22px!important;}
  .main-content{padding:16px!important;}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;

// ── HELPERS ──────────────────────────────────────────────
const fmt=(n)=>{if(!n&&n!==0)return"0₫";return Number(n).toLocaleString("vi-VN")+"₫";};
const fmtShort=(n)=>{if(!n&&n!==0)return"0";const num=Number(n);if(num>=1e9)return(num/1e9).toFixed(1)+"T";if(num>=1e6)return(num/1e6).toFixed(1)+"M";if(num>=1e3)return(num/1e3).toFixed(0)+"K";return num.toString();};
const parseInput=(val)=>{const clean=String(val).replace(/[^0-9.]/g,"");const num=parseFloat(clean);if(isNaN(num))return 0;return num*1000;};
const MONTHS=["Tháng 1","Tháng 2","Tháng 3","Tháng 4","Tháng 5","Tháng 6","Tháng 7","Tháng 8","Tháng 9","Tháng 10","Tháng 11","Tháng 12"];
const getDaysInMonth=(y,m)=>new Date(y,m+1,0).getDate();
const todayDate=new Date();
const todayStr=todayDate.toISOString().split("T")[0];

// ── THEMES ───────────────────────────────────────────────
const THEMES={
  dark:{bg:"#0f0f13",card:"#1a1a24",border:"#2a2a3a",text:"#e8e8f0",sub:"#8888aa",accent2:"#4ecdc4",danger:"#ff6b6b",success:"#51cf66",warning:"#ffd43b"},
  light:{bg:"#f0f0f7",card:"#ffffff",border:"#e0e0ef",text:"#1a1a2e",sub:"#6666aa",accent2:"#2ba89e",danger:"#e03131",success:"#2f9e44",warning:"#e67700"},
  ocean:{bg:"#020c1b",card:"#0a192f",border:"#1d3557",text:"#ccd6f6",sub:"#8892b0",accent2:"#57cbff",danger:"#ff5555",success:"#64ffda",warning:"#ffd700"},
  rose:{bg:"#1a0a0f",card:"#2a1018",border:"#4a2030",text:"#f0d0d8",sub:"#c08090",accent2:"#ffb347",danger:"#ff4444",success:"#88d8b0",warning:"#ffb347"},
};
const ACCENTS={purple:"#7c6af7",teal:"#4ecdc4",blue:"#4dabf7",pink:"#f06595",orange:"#ff922b",green:"#51cf66"};

// ── LOCAL STORAGE ─────────────────────────────────────────
const LS={
  get:(k,d)=>{try{const v=localStorage.getItem("qlcn_"+k);return v?JSON.parse(v):d;}catch{return d;}},
  set:(k,v)=>{try{localStorage.setItem("qlcn_"+k,JSON.stringify(v));}catch{}},
};

// ── GOOGLE SHEETS SYNC ────────────────────────────────────
const GS={
  async write(url,sheet,rows){if(!url)return;try{await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"write",sheet,rows})});}catch{}},
  async read(url,sheet){if(!url)return null;try{const r=await fetch(url+"?sheet="+sheet);const d=await r.json();return d.rows||null;}catch{return null;}},
};

// ══════════════════════════════════════════════════════════
//  APP
// ══════════════════════════════════════════════════════════
function App(){
  const [theme,setTheme]=useState(()=>LS.get("theme","dark"));
  const [accentKey,setAccentKey]=useState(()=>LS.get("accentKey","purple"));
  const [tab,setTab]=useState("dashboard");
  const [gasUrl,setGasUrl]=useState(()=>LS.get("gasUrl",""));
  const [tgToken,setTgToken]=useState(()=>LS.get("tgToken",""));
  const [tgChat,setTgChat]=useState(()=>LS.get("tgChat",""));
  const [toast,setToast]=useState(null);
  const [finance,setFinance]=useState(()=>LS.get("finance",{}));
  const [savings,setSavings]=useState(()=>LS.get("savings",{}));
  const [tasks,setTasks]=useState(()=>LS.get("tasks",{list:[],cats:["Việc chính","Việc phụ","Phát sinh"]}));

  const T={...THEMES[theme],accent:ACCENTS[accentKey]};

  useEffect(()=>{LS.set("theme",theme);},[theme]);
  useEffect(()=>{LS.set("accentKey",accentKey);},[accentKey]);
  useEffect(()=>{LS.set("finance",finance);},[finance]);
  useEffect(()=>{LS.set("savings",savings);},[savings]);
  useEffect(()=>{LS.set("tasks",tasks);},[tasks]);

  const showToast=(msg,type="success")=>{setToast({msg,type});setTimeout(()=>setToast(null),3200);};

  const tg=useCallback(async(msg)=>{
    if(!tgToken||!tgChat)return;
    try{await fetch(`https://api.telegram.org/bot${tgToken}/sendMessage`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chat_id:tgChat,text:msg,parse_mode:"HTML"})});}catch{}
  },[tgToken,tgChat]);

  // Reminder on open
  useEffect(()=>{
    const last=LS.get("lastReminder","");
    if(last===todayStr)return;
    LS.set("lastReminder",todayStr);
    const pending=(tasks.list||[]).filter(t=>!t.done&&t.due===todayStr);
    if(pending.length>0){
      showToast(`📋 Có ${pending.length} việc cần làm hôm nay!`,"info");
      tg(`📋 <b>Nhắc nhở hôm nay</b>\nCó <b>${pending.length} việc</b> cần làm:\n${pending.map(t=>`• ${t.title}`).join("\n")}`);
    }
  },[]);

  const props={T,finance,setFinance,savings,setSavings,tasks,setTasks,showToast,tg,gasUrl,GS};

  return(
    <div style={{height:"100vh",display:"flex",background:T.bg,color:T.text,fontFamily:"'Be Vietnam Pro',sans-serif",overflow:"hidden"}}>
      {toast&&<div style={{position:"fixed",top:20,right:20,zIndex:9999,background:toast.type==="success"?T.success:toast.type==="info"?T.accent:T.danger,color:"#fff",padding:"12px 20px",borderRadius:12,fontWeight:600,fontSize:14,boxShadow:"0 8px 32px rgba(0,0,0,0.35)",animation:"slideIn .3s ease",maxWidth:280}}>{toast.msg}</div>}

      <Sidebar T={T} tab={tab} setTab={setTab}/>

      <div className="main-content" style={{flex:1,overflowY:"auto",padding:"28px 28px 40px",animation:"fadeIn .3s ease"}}>
        {tab==="dashboard"&&<Dashboard {...props}/>}
        {tab==="finance"&&<Finance {...props}/>}
        {tab==="savings"&&<Savings {...props}/>}
        {tab==="tasks"&&<Tasks {...props}/>}
        {tab==="settings"&&<Settings T={T} theme={theme} setTheme={setTheme} accentKey={accentKey} setAccentKey={setAccentKey} gasUrl={gasUrl} setGasUrl={setGasUrl} tgToken={tgToken} setTgToken={setTgToken} tgChat={tgChat} setTgChat={setTgChat} showToast={showToast} tg={tg}/>}
      </div>
    </div>
  );
}

// ══ SIDEBAR ══════════════════════════════════════════════
function Sidebar({T,tab,setTab}){
  const tabs=[{id:"dashboard",icon:"⊞",label:"Dashboard"},{id:"finance",icon:"💰",label:"Tài Chính"},{id:"savings",icon:"🐷",label:"Tiết Kiệm"},{id:"tasks",icon:"✅",label:"Công Việc"},{id:"settings",icon:"⚙️",label:"Cài Đặt"}];
  return(
    <div className="sidebar" style={{width:200,background:T.card,borderRight:`1px solid ${T.border}`,display:"flex",flexDirection:"column",padding:"20px 12px",gap:4,flexShrink:0,overflowY:"auto"}}>
      <div style={{marginBottom:20,paddingBottom:16,borderBottom:`1px solid ${T.border}`,paddingLeft:6}}>
        <div className="logo-icon" style={{fontSize:28,marginBottom:4}}>⊕</div>
        <div className="logo-text" style={{fontWeight:800,fontSize:15,color:T.accent,lineHeight:1.2}}>Quản Lý</div>
        <div className="logo-text" style={{fontWeight:800,fontSize:15,lineHeight:1.2}}>Cá Nhân</div>
        <div className="logo-text" style={{fontSize:10,color:T.sub,marginTop:4}}>{todayDate.toLocaleDateString("vi-VN",{weekday:"short",day:"2-digit",month:"2-digit",year:"numeric"})}</div>
      </div>
      {tabs.map(t=>(
        <button key={t.id} onClick={()=>setTab(t.id)} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 10px",borderRadius:10,border:"none",cursor:"pointer",background:tab===t.id?T.accent+"25":"transparent",color:tab===t.id?T.accent:T.sub,fontWeight:tab===t.id?700:500,fontSize:13,transition:"all .15s",textAlign:"left",width:"100%"}}>
          <span style={{fontSize:17,flexShrink:0}}>{t.icon}</span>
          <span className="label">{t.label}</span>
        </button>
      ))}
    </div>
  );
}

// ══ DASHBOARD ═════════════════════════════════════════════
function Dashboard({T,finance,savings,tasks}){
  const y=todayDate.getFullYear(),m=todayDate.getMonth();
  const mk=`${y}-${m}`;
  const fd=finance[mk]||{};
  const income=fd.income||0;
  const exp=(fd.fixed||[]).reduce((s,i)=>s+(i.v||0),0)+(fd.living||[]).reduce((s,i)=>s+(i.v||0),0)+(fd.invest||[]).reduce((s,i)=>s+(i.v||0),0);
  const rem=income-exp;
  const sd=savings[mk]||{};
  const goal=sd.goal||0;
  const dim=getDaysInMonth(y,m);
  const daily=goal?goal/dim:0;
  const savedDays=(sd.days||[]).filter(d=>d.ok).length;
  const totalSaved=savedDays*daily;
  const todayTasks=(tasks.list||[]).filter(t=>t.due===todayStr);
  const doneTasks=todayTasks.filter(t=>t.done);

  const cards=[
    {label:"Thu nhập tháng này",val:fmt(income),color:T.success,icon:"📈"},
    {label:"Tổng chi tiêu",val:fmt(exp),color:T.danger,icon:"📉"},
    {label:"Còn lại",val:fmt(rem),color:rem>=0?T.success:T.danger,icon:rem>=0?"✨":"⚠️"},
    {label:"Đã tiết kiệm",val:fmt(totalSaved),color:T.accent,icon:"🐷"},
  ];

  return(
    <div>
      <h1 style={{fontWeight:800,fontSize:24,marginBottom:4}}>Dashboard</h1>
      <p style={{color:T.sub,marginBottom:24,fontSize:13}}>Xin chào! Tổng quan hôm nay — {todayDate.toLocaleDateString("vi-VN",{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"})}</p>

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:14,marginBottom:24}}>
        {cards.map((c,i)=>(
          <div key={i} style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:14,padding:"18px 20px"}}>
            <div style={{fontSize:22,marginBottom:6}}>{c.icon}</div>
            <div style={{fontSize:10,color:T.sub,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:3}}>{c.label}</div>
            <div style={{fontSize:20,fontWeight:800,color:c.color}}>{c.val}</div>
          </div>
        ))}
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
        <div style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:14,padding:20}}>
          <div style={{fontWeight:700,fontSize:14,marginBottom:14,display:"flex",justifyContent:"space-between"}}>
            <span>📋 Việc hôm nay</span>
            <span style={{fontSize:12,color:T.sub}}>{doneTasks.length}/{todayTasks.length} xong</span>
          </div>
          {todayTasks.length===0?<div style={{color:T.sub,fontSize:13}}>Không có việc hôm nay 🎉</div>:
            todayTasks.filter(t=>!t.done).slice(0,4).map((t,i)=>(
              <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 0",borderBottom:`1px solid ${T.border}`}}>
                <div style={{width:7,height:7,borderRadius:"50%",background:t.type==="Việc chính"?T.danger:t.type==="Việc phụ"?T.accent:T.warning,flexShrink:0}}/>
                <span style={{fontSize:12,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.title}</span>
              </div>
            ))
          }
          {todayTasks.length>0&&<div style={{marginTop:10,background:T.border,borderRadius:99,height:6}}>
            <div style={{background:T.success,height:6,borderRadius:99,width:`${todayTasks.length?(doneTasks.length/todayTasks.length)*100:0}%`,transition:"width .5s"}}/>
          </div>}
        </div>

        <div style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:14,padding:20}}>
          <div style={{fontWeight:700,fontSize:14,marginBottom:14}}>🐷 Tiết kiệm T.{m+1}</div>
          {!goal?<div style={{color:T.sub,fontSize:13}}>Chưa đặt mục tiêu</div>:<>
            <div style={{fontSize:11,color:T.sub,marginBottom:6}}>Mục tiêu: {fmt(goal)}</div>
            <div style={{background:T.border,borderRadius:99,height:10,marginBottom:10}}>
              <div style={{background:`linear-gradient(90deg,${T.accent},${T.accent2})`,height:10,borderRadius:99,width:`${Math.min(100,(totalSaved/goal)*100)}%`,transition:"width .5s"}}/>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:12}}>
              <span style={{color:T.accent,fontWeight:700}}>{fmt(totalSaved)}</span>
              <span style={{color:T.sub}}>{savedDays}/{dim} ngày</span>
            </div>
          </>}
        </div>
      </div>
    </div>
  );
}

// ══ FINANCE ═══════════════════════════════════════════════
function Finance({T,finance,setFinance,showToast,tg,gasUrl,GS}){
  const [yr,setYr]=useState(todayDate.getFullYear());
  const [mo,setMo]=useState(todayDate.getMonth());
  const [edit,setEdit]=useState(false);
  const [addSec,setAddSec]=useState(null);
  const [newName,setNewName]=useState("");
  const [newVal,setNewVal]=useState("");

  const mk=`${yr}-${mo}`;
  const fd=finance[mk]||{income:0,fixed:[],living:[],invest:[],note:""};

  const up=(patch)=>setFinance(p=>({...p,[mk]:{...fd,...patch}}));

  const sections=[
    {key:"fixed",label:"Chi tiêu cố định",color:T.danger,icon:"🔒"},
    {key:"living",label:"Chi tiêu sinh hoạt",color:T.warning,icon:"🛒"},
    {key:"invest",label:"Tích luỹ & Đầu tư",color:T.accent,icon:"📈"},
  ];

  const totalFixed=(fd.fixed||[]).reduce((s,i)=>s+(i.v||0),0);
  const totalLiving=(fd.living||[]).reduce((s,i)=>s+(i.v||0),0);
  const totalInvest=(fd.invest||[]).reduce((s,i)=>s+(i.v||0),0);
  const totalExp=totalFixed+totalLiving+totalInvest;
  const rem=(fd.income||0)-totalExp;

  const addItem=(key)=>{
    if(!newName.trim())return;
    const arr=[...(fd[key]||[]),{n:newName,v:parseInput(newVal)}];
    up({[key]:arr});
    setNewName("");setNewVal("");setAddSec(null);
    showToast("Đã thêm!");
    if(gasUrl)GS.write(gasUrl,`Finance_${yr}_${String(mo+1).padStart(2,"0")}`,[["key","val"],[...Object.entries({...fd,[key]:arr}).map(([k,v])=>[k,JSON.stringify(v)])]]);
  };
  const removeItem=(key,idx)=>{const arr=[...(fd[key]||[])];arr.splice(idx,1);up({[key]:arr});};
  const updateItem=(key,idx,field,val)=>{const arr=[...(fd[key]||[])];arr[idx]={...arr[idx],[field]:field==="v"?parseInput(val):val};up({[key]:arr});};

  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:20,flexWrap:"wrap",gap:10}}>
        <div>
          <h1 style={{fontWeight:800,fontSize:22,marginBottom:2}}>💰 Tài Chính Cá Nhân</h1>
          <p style={{color:T.sub,fontSize:12}}>500 = 500.000₫ · 1000 = 1.000.000₫</p>
        </div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
          <select value={yr} onChange={e=>setYr(+e.target.value)} style={{background:T.card,color:T.text,border:`1px solid ${T.border}`,borderRadius:8,padding:"5px 8px",fontSize:12}}>
            {[2024,2025,2026,2027,2028].map(y=><option key={y} value={y}>{y}</option>)}
          </select>
          <select value={mo} onChange={e=>setMo(+e.target.value)} style={{background:T.card,color:T.text,border:`1px solid ${T.border}`,borderRadius:8,padding:"5px 8px",fontSize:12}}>
            {MONTHS.map((m,i)=><option key={i} value={i}>{m}</option>)}
          </select>
          <button onClick={()=>setEdit(!edit)} style={{background:edit?T.accent:T.card,color:edit?"#fff":T.text,border:`1px solid ${T.border}`,borderRadius:8,padding:"5px 12px",cursor:"pointer",fontWeight:600,fontSize:12}}>
            {edit?"✓ Xong":"✏️ Sửa"}
          </button>
        </div>
      </div>

      {/* Summary */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))",gap:10,marginBottom:18}}>
        {[{l:"Thu nhập",v:fd.income||0,c:T.success},{l:"Cố định",v:totalFixed,c:T.danger},{l:"Sinh hoạt",v:totalLiving,c:T.warning},{l:"Tích luỹ",v:totalInvest,c:T.accent},{l:"Còn lại",v:rem,c:rem>=0?T.success:T.danger}].map((s,i)=>(
          <div key={i} style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:12,padding:"12px 14px"}}>
            <div style={{fontSize:10,color:T.sub,marginBottom:3,fontWeight:600}}>{s.l}</div>
            <div style={{fontSize:16,fontWeight:800,color:s.c}}>{fmtShort(s.v)}</div>
          </div>
        ))}
      </div>

      {/* Income */}
      <div style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:14,padding:18,marginBottom:12}}>
        <div style={{fontWeight:700,fontSize:14,marginBottom:10,color:T.success}}>📈 Thu Nhập</div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <input type="number" value={(fd.income||0)/1000||""} onChange={e=>up({income:parseInput(e.target.value)})} placeholder="vd: 15000 = 15tr" style={{flex:1,background:T.bg,color:T.text,border:`1px solid ${T.border}`,borderRadius:8,padding:"7px 10px",fontSize:13}}/>
          <span style={{color:T.success,fontWeight:700,fontSize:13,minWidth:90}}>{fmt(fd.income||0)}</span>
        </div>
      </div>

      {/* Sections */}
      {sections.map(sec=>(
        <div key={sec.key} style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:14,padding:18,marginBottom:12}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
            <div style={{fontWeight:700,fontSize:14,color:sec.color}}>{sec.icon} {sec.label}</div>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <span style={{fontSize:12,fontWeight:700,color:sec.color}}>{fmt((fd[sec.key]||[]).reduce((s,i)=>s+(i.v||0),0))}</span>
              <button onClick={()=>setAddSec(sec.key)} style={{background:T.accent+"22",color:T.accent,border:"none",borderRadius:7,padding:"3px 9px",cursor:"pointer",fontSize:11,fontWeight:700}}>+ Thêm</button>
            </div>
          </div>
          {(fd[sec.key]||[]).map((item,idx)=>(
            <div key={idx} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 0",borderBottom:`1px solid ${T.border}`}}>
              <div style={{width:6,height:6,borderRadius:"50%",background:sec.color,flexShrink:0}}/>
              {edit?(
                <>
                  <input value={item.n} onChange={e=>updateItem(sec.key,idx,"n",e.target.value)} style={{flex:1,background:T.bg,color:T.text,border:`1px solid ${T.border}`,borderRadius:6,padding:"3px 7px",fontSize:12}}/>
                  <input type="number" value={item.v?item.v/1000:""} onChange={e=>updateItem(sec.key,idx,"v",e.target.value)} placeholder="số" style={{width:90,background:T.bg,color:T.text,border:`1px solid ${T.border}`,borderRadius:6,padding:"3px 7px",fontSize:12}}/>
                  <button onClick={()=>removeItem(sec.key,idx)} style={{background:"none",color:T.danger,border:"none",cursor:"pointer",fontSize:18,lineHeight:1}}>×</button>
                </>
              ):(
                <>
                  <span style={{flex:1,fontSize:13}}>{item.n}</span>
                  <span style={{fontSize:13,fontWeight:700,color:sec.color}}>{fmt(item.v||0)}</span>
                </>
              )}
            </div>
          ))}
          {addSec===sec.key&&(
            <div style={{display:"flex",gap:7,marginTop:10,flexWrap:"wrap"}}>
              <input value={newName} onChange={e=>setNewName(e.target.value)} placeholder="Tên danh mục" style={{flex:1,minWidth:100,background:T.bg,color:T.text,border:`1px solid ${T.accent}`,borderRadius:8,padding:"6px 9px",fontSize:12}}/>
              <input type="number" value={newVal} onChange={e=>setNewVal(e.target.value)} placeholder="Số tiền" style={{width:100,background:T.bg,color:T.text,border:`1px solid ${T.accent}`,borderRadius:8,padding:"6px 9px",fontSize:12}}/>
              <button onClick={()=>addItem(sec.key)} style={{background:T.accent,color:"#fff",border:"none",borderRadius:8,padding:"6px 13px",cursor:"pointer",fontWeight:700,fontSize:12}}>Lưu</button>
              <button onClick={()=>setAddSec(null)} style={{background:"transparent",color:T.sub,border:`1px solid ${T.border}`,borderRadius:8,padding:"6px 10px",cursor:"pointer",fontSize:12}}>Huỷ</button>
            </div>
          )}
        </div>
      ))}

      {/* Summary + Note */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <div style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:14,padding:18}}>
          <div style={{fontWeight:700,fontSize:14,marginBottom:12}}>📊 Tổng kết {MONTHS[mo]}</div>
          {[{l:"Thu nhập",v:fd.income||0,c:T.success},{l:"Tổng chi",v:totalExp,c:T.danger},{l:"Còn lại",v:rem,c:rem>=0?T.success:T.danger,b:true}].map((r,i)=>(
            <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:i<2?`1px solid ${T.border}`:"none"}}>
              <span style={{fontSize:12,color:T.sub}}>{r.l}</span>
              <span style={{fontSize:13,fontWeight:r.b?800:600,color:r.c}}>{fmt(r.v)}</span>
            </div>
          ))}
          <div style={{marginTop:10,padding:"8px 12px",background:rem>=0?T.success+"22":T.danger+"22",borderRadius:8,textAlign:"center",fontWeight:700,fontSize:12,color:rem>=0?T.success:T.danger}}>
            {rem>=0?`✨ Dư ${fmt(rem)}`:`⚠️ Thiếu ${fmt(Math.abs(rem))}`}
          </div>
        </div>
        <div style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:14,padding:18}}>
          <div style={{fontWeight:700,fontSize:14,marginBottom:10}}>📝 Ghi chú</div>
          <textarea value={fd.note||""} onChange={e=>up({note:e.target.value})} placeholder="Ghi chú tháng này..." rows={5} style={{width:"100%",background:T.bg,color:T.text,border:`1px solid ${T.border}`,borderRadius:8,padding:"8px 10px",fontSize:12,resize:"vertical"}}/>
        </div>
      </div>
    </div>
  );
}

// ══ SAVINGS ═══════════════════════════════════════════════
function Savings({T,savings,setSavings,showToast,tg}){
  const [yr,setYr]=useState(todayDate.getFullYear());
  const [mo,setMo]=useState(todayDate.getMonth());
  const [goalInput,setGoalInput]=useState("");
  const [editGoal,setEditGoal]=useState(false);

  const mk=`${yr}-${mo}`;
  const dim=getDaysInMonth(yr,mo);
  const sd=savings[mk]||{goal:0,days:[]};
  const goal=sd.goal||0;
  const daily=goal?goal/dim:0;

  const ensureDays=(data)=>{
    if(!data.days||data.days.length!==dim){
      return{...data,days:Array.from({length:dim},(_,i)=>({d:i+1,ok:false}))};
    }
    return data;
  };

  const up=(patch)=>setSavings(p=>({...p,[mk]:{...ensureDays(sd),...patch}}));

  const setGoal=()=>{
    const g=parseInput(goalInput);
    const days=Array.from({length:dim},(_,i)=>({d:i+1,ok:false}));
    up({goal:g,days});
    setEditGoal(false);setGoalInput("");
    showToast("Đã cập nhật mục tiêu!");
  };

  const toggleDay=(idx)=>{
    const data=ensureDays(sd);
    const days=[...data.days];
    days[idx]={...days[idx],ok:!days[idx].ok};
    up({days});
    const total=days.filter(d=>d.ok).length*daily;
    if(days[idx].ok){
      showToast(`✅ Đã tiết kiệm ngày ${idx+1}!`);
      tg(`🐷 Tiết kiệm ngày <b>${idx+1}/${mo+1}/${yr}</b>\nĐã bỏ ống: <b>${fmt(daily)}</b>\nTổng tháng: <b>${fmt(total)}</b>`);
    }
  };

  const data=ensureDays(sd);
  const savedDays=data.days.filter(d=>d.ok).length;
  const totalSaved=savedDays*daily;
  const prog=goal?Math.min(100,(totalSaved/goal)*100):0;

  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:20,flexWrap:"wrap",gap:10}}>
        <h1 style={{fontWeight:800,fontSize:22}}>🐷 Tiết Kiệm</h1>
        <div style={{display:"flex",gap:8}}>
          <select value={yr} onChange={e=>setYr(+e.target.value)} style={{background:T.card,color:T.text,border:`1px solid ${T.border}`,borderRadius:8,padding:"5px 8px",fontSize:12}}>
            {[2024,2025,2026,2027].map(y=><option key={y} value={y}>{y}</option>)}
          </select>
          <select value={mo} onChange={e=>setMo(+e.target.value)} style={{background:T.card,color:T.text,border:`1px solid ${T.border}`,borderRadius:8,padding:"5px 8px",fontSize:12}}>
            {MONTHS.map((m,i)=><option key={i} value={i}>{m}</option>)}
          </select>
        </div>
      </div>

      {/* Goal */}
      <div style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:14,padding:20,marginBottom:16}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <div style={{fontWeight:700,fontSize:14}}>🎯 Mục tiêu {MONTHS[mo]}/{yr}</div>
          <button onClick={()=>setEditGoal(!editGoal)} style={{background:T.accent+"22",color:T.accent,border:"none",borderRadius:7,padding:"4px 11px",cursor:"pointer",fontSize:11,fontWeight:700}}>{editGoal?"Huỷ":"Đặt mục tiêu"}</button>
        </div>
        {editGoal&&(
          <div style={{display:"flex",gap:8,marginBottom:14}}>
            <input type="number" value={goalInput} onChange={e=>setGoalInput(e.target.value)} placeholder="vd: 3000 = 3tr" style={{flex:1,background:T.bg,color:T.text,border:`1px solid ${T.accent}`,borderRadius:8,padding:"7px 10px",fontSize:13}}/>
            <button onClick={setGoal} style={{background:T.accent,color:"#fff",border:"none",borderRadius:8,padding:"7px 14px",cursor:"pointer",fontWeight:700,fontSize:13}}>Lưu</button>
          </div>
        )}
        {goal>0?(
          <div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:14}}>
              {[{l:"Mục tiêu",v:fmt(goal),c:T.accent},{l:"Mỗi ngày",v:fmt(daily),c:T.text},{l:"Đã tiết kiệm",v:fmt(totalSaved),c:T.success}].map((s,i)=>(
                <div key={i} style={{textAlign:"center",background:T.bg,borderRadius:10,padding:"10px 8px"}}>
                  <div style={{fontSize:15,fontWeight:800,color:s.c}}>{s.v}</div>
                  <div style={{fontSize:10,color:T.sub,marginTop:2}}>{s.l}</div>
                </div>
              ))}
            </div>
            <div style={{background:T.border,borderRadius:99,height:12,marginBottom:6}}>
              <div style={{background:`linear-gradient(90deg,${T.accent},${T.accent2})`,height:12,borderRadius:99,width:`${prog}%`,transition:"width .5s"}}/>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:11}}>
              <span style={{color:T.sub}}>{savedDays}/{dim} ngày đã tiết kiệm</span>
              <span style={{color:T.accent,fontWeight:700}}>{prog.toFixed(1)}%</span>
            </div>
          </div>
        ):<div style={{color:T.sub,fontSize:13}}>Chưa đặt mục tiêu cho tháng này</div>}
      </div>

      {/* Calendar */}
      {goal>0&&(
        <div style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:14,padding:20}}>
          <div style={{fontWeight:700,fontSize:14,marginBottom:14}}>📅 Tick từng ngày đã bỏ ống</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:6}}>
            {["CN","T2","T3","T4","T5","T6","T7"].map(d=>(
              <div key={d} style={{textAlign:"center",fontSize:10,color:T.sub,fontWeight:700,padding:"3px 0"}}>{d}</div>
            ))}
            {Array.from({length:new Date(yr,mo,1).getDay()}).map((_,i)=><div key={"e"+i}/>)}
            {data.days.map((d,i)=>{
              const isToday=yr===todayDate.getFullYear()&&mo===todayDate.getMonth()&&d.d===todayDate.getDate();
              return(
                <button key={i} onClick={()=>toggleDay(i)} title={`Ngày ${d.d}${d.ok?" ✓ Đã tiết kiệm":""}`}
                  style={{aspectRatio:"1",borderRadius:9,border:isToday?`2px solid ${T.accent}`:`1px solid ${T.border}`,background:d.ok?T.accent:T.bg,color:d.ok?"#fff":T.text,cursor:"pointer",fontSize:11,fontWeight:isToday?800:500,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",transition:"all .12s",gap:1}}>
                  <span>{d.d}</span>
                  {d.ok&&<span style={{fontSize:7}}>✓</span>}
                </button>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

// ══ TASKS ═════════════════════════════════════════════════
function Tasks({T,tasks,setTasks,showToast,tg}){
  const [view,setView]=useState("today");
  const [showAdd,setShowAdd]=useState(false);
  const [filter,setFilter]=useState("all");
  const [showAddCat,setShowAddCat]=useState(false);
  const [newCat,setNewCat]=useState("");
  const [newTask,setNewTask]=useState({title:"",type:"Việc chính",due:todayStr,total:0,done:0,note:""});

  const list=tasks.list||[];
  const cats=tasks.cats||["Việc chính","Việc phụ","Phát sinh"];
  const up=(patch)=>setTasks(p=>({...p,...patch}));

  const todayTasks=list.filter(t=>t.due===todayStr);
  const doneCnt=todayTasks.filter(t=>t.done).length;
  const pendCnt=todayTasks.length-doneCnt;

  const visible=list.filter(t=>{
    const vOk=view==="today"?t.due===todayStr:t.due<todayStr;
    const fOk=filter==="all"||(filter==="done"&&t.done)||(filter==="pending"&&!t.done)||t.type===filter;
    return vOk&&fOk;
  });

  const addTask=()=>{
    if(!newTask.title.trim())return;
    const t={...newTask,id:Date.now(),done:false,created:todayStr};
    up({list:[...list,t]});
    setNewTask({title:"",type:"Việc chính",due:todayStr,total:0,done:0,note:""});
    setShowAdd(false);
    showToast("Đã thêm công việc!");
    tg(`📋 Việc mới: <b>${t.title}</b>\nLoại: ${t.type} | Ngày: ${t.due}`);
  };

  const toggle=(id)=>{
    const t=list.find(x=>x.id===id);
    up({list:list.map(x=>x.id===id?{...x,done:!x.done}:x)});
    if(t&&!t.done){showToast(`✅ Xong: ${t.title}`);tg(`✅ Hoàn thành: <b>${t.title}</b>`);}
  };

  const del=(id)=>{up({list:list.filter(x=>x.id!==id)});showToast("Đã xoá","error");};
  const updProg=(id,val)=>up({list:list.map(x=>x.id===id?{...x,done:Math.min(x.total,Math.max(0,Number(val)))}:x)});

  const addCat=()=>{
    if(!newCat.trim()||cats.includes(newCat))return;
    up({cats:[...cats,newCat]});setNewCat("");setShowAddCat(false);showToast("Đã thêm danh mục!");
  };

  const typeColor=(type)=>type==="Việc chính"?T.danger:type==="Việc phụ"?T.accent:T.warning;

  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:20,flexWrap:"wrap",gap:10}}>
        <h1 style={{fontWeight:800,fontSize:22}}>✅ Công Việc Hằng Ngày</h1>
        <button onClick={()=>setShowAdd(true)} style={{background:T.accent,color:"#fff",border:"none",borderRadius:10,padding:"7px 16px",cursor:"pointer",fontWeight:700,fontSize:13}}>+ Thêm việc</button>
      </div>

      {/* Stats */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:16}}>
        {[{l:"Tổng hôm nay",v:todayTasks.length,c:T.text},{l:"Hoàn thành",v:doneCnt,c:T.success},{l:"Còn lại",v:pendCnt,c:T.warning}].map((s,i)=>(
          <div key={i} style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:12,padding:"12px",textAlign:"center"}}>
            <div style={{fontSize:24,fontWeight:800,color:s.c}}>{s.v}</div>
            <div style={{fontSize:10,color:T.sub,marginTop:1}}>{s.l}</div>
          </div>
        ))}
      </div>

      {todayTasks.length>0&&(
        <div style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:12,padding:"12px 16px",marginBottom:14}}>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:6}}>
            <span style={{fontWeight:600}}>Tiến độ hôm nay</span>
            <span style={{color:T.accent,fontWeight:700}}>{Math.round((doneCnt/todayTasks.length)*100)}%</span>
          </div>
          <div style={{background:T.border,borderRadius:99,height:7}}>
            <div style={{background:`linear-gradient(90deg,${T.success},${T.accent})`,height:7,borderRadius:99,width:`${(doneCnt/todayTasks.length)*100}%`,transition:"width .5s"}}/>
          </div>
        </div>
      )}

      {/* Filters */}
      <div style={{display:"flex",gap:7,marginBottom:12,flexWrap:"wrap",alignItems:"center"}}>
        {["today","history"].map(v=>(
          <button key={v} onClick={()=>setView(v)} style={{background:view===v?T.accent:"transparent",color:view===v?"#fff":T.sub,border:`1px solid ${view===v?T.accent:T.border}`,borderRadius:7,padding:"4px 12px",cursor:"pointer",fontSize:12,fontWeight:600}}>
            {v==="today"?"📅 Hôm nay":"📚 Lịch sử"}
          </button>
        ))}
        <div style={{flex:1}}/>
        <select value={filter} onChange={e=>setFilter(e.target.value)} style={{background:T.card,color:T.text,border:`1px solid ${T.border}`,borderRadius:7,padding:"4px 8px",fontSize:12}}>
          <option value="all">Tất cả</option>
          <option value="pending">Chưa xong</option>
          <option value="done">Hoàn thành</option>
          {cats.map(c=><option key={c} value={c}>{c}</option>)}
        </select>
        <button onClick={()=>setShowAddCat(!showAddCat)} style={{background:T.card,color:T.accent,border:`1px solid ${T.border}`,borderRadius:7,padding:"4px 10px",cursor:"pointer",fontSize:12,fontWeight:600}}>+ DM</button>
      </div>

      {showAddCat&&(
        <div style={{display:"flex",gap:7,marginBottom:12}}>
          <input value={newCat} onChange={e=>setNewCat(e.target.value)} placeholder="Tên danh mục mới..." style={{flex:1,background:T.card,color:T.text,border:`1px solid ${T.accent}`,borderRadius:8,padding:"6px 10px",fontSize:12}}/>
          <button onClick={addCat} style={{background:T.accent,color:"#fff",border:"none",borderRadius:8,padding:"6px 13px",cursor:"pointer",fontWeight:700,fontSize:12}}>Thêm</button>
        </div>
      )}

      {/* Add task form */}
      {showAdd&&(
        <div style={{background:T.card,border:`1px solid ${T.accent}`,borderRadius:14,padding:18,marginBottom:16}}>
          <div style={{fontWeight:700,fontSize:14,marginBottom:12}}>➕ Thêm công việc mới</div>
          <div style={{display:"grid",gap:8}}>
            <input value={newTask.title} onChange={e=>setNewTask({...newTask,title:e.target.value})} placeholder="Tên công việc *" style={{background:T.bg,color:T.text,border:`1px solid ${T.border}`,borderRadius:8,padding:"7px 10px",fontSize:13}}/>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              <select value={newTask.type} onChange={e=>setNewTask({...newTask,type:e.target.value})} style={{background:T.bg,color:T.text,border:`1px solid ${T.border}`,borderRadius:8,padding:"7px 8px",fontSize:12}}>
                {cats.map(c=><option key={c} value={c}>{c}</option>)}
              </select>
              <input type="date" value={newTask.due} onChange={e=>setNewTask({...newTask,due:e.target.value})} style={{background:T.bg,color:T.text,border:`1px solid ${T.border}`,borderRadius:8,padding:"7px 8px",fontSize:12}}/>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              <input type="number" value={newTask.total||""} onChange={e=>setNewTask({...newTask,total:+e.target.value})} placeholder="Tổng số (vd: 20 video)" style={{background:T.bg,color:T.text,border:`1px solid ${T.border}`,borderRadius:8,padding:"7px 8px",fontSize:12}}/>
              <input value={newTask.note} onChange={e=>setNewTask({...newTask,note:e.target.value})} placeholder="Ghi chú..." style={{background:T.bg,color:T.text,border:`1px solid ${T.border}`,borderRadius:8,padding:"7px 8px",fontSize:12}}/>
            </div>
            <div style={{display:"flex",gap:7}}>
              <button onClick={addTask} style={{background:T.accent,color:"#fff",border:"none",borderRadius:8,padding:"7px 18px",cursor:"pointer",fontWeight:700,fontSize:13}}>Lưu</button>
              <button onClick={()=>setShowAdd(false)} style={{background:"transparent",color:T.sub,border:`1px solid ${T.border}`,borderRadius:8,padding:"7px 13px",cursor:"pointer",fontSize:12}}>Huỷ</button>
            </div>
          </div>
        </div>
      )}

      {/* Task list */}
      <div style={{display:"grid",gap:8}}>
        {visible.length===0?(
          <div style={{textAlign:"center",padding:36,color:T.sub,fontSize:13}}>
            {view==="today"?"Không có việc hôm nay 🎉":"Không có lịch sử"}
          </div>
        ):visible.map(task=>(
          <div key={task.id} style={{background:T.card,border:`1px solid ${task.done?T.success+"44":T.border}`,borderRadius:12,padding:14,transition:"all .15s"}}>
            <div style={{display:"flex",alignItems:"flex-start",gap:10}}>
              <button onClick={()=>toggle(task.id)} style={{width:20,height:20,borderRadius:5,border:`2px solid ${task.done?T.success:T.border}`,background:task.done?T.success:"transparent",color:"#fff",cursor:"pointer",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,marginTop:2}}>
                {task.done&&"✓"}
              </button>
              <div style={{flex:1}}>
                <div style={{display:"flex",alignItems:"center",gap:7,flexWrap:"wrap",marginBottom:4}}>
                  <span style={{fontWeight:700,fontSize:13,textDecoration:task.done?"line-through":"none",color:task.done?T.sub:T.text}}>{task.title}</span>
                  <span style={{fontSize:10,fontWeight:700,color:typeColor(task.type),background:typeColor(task.type)+"22",padding:"1px 7px",borderRadius:99}}>{task.type}</span>
                  {task.due&&<span style={{fontSize:10,color:T.sub}}>{task.due}</span>}
                </div>
                {task.total>0&&(
                  <div style={{marginTop:6}}>
                    <div style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:3}}>
                      <span style={{color:T.sub}}>Tiến độ</span>
                      <span style={{color:T.accent,fontWeight:700}}>{task.done||0}/{task.total} ({Math.round(((task.done||0)/task.total)*100)}%)</span>
                    </div>
                    <div style={{display:"flex",alignItems:"center",gap:7}}>
                      <div style={{flex:1,background:T.border,borderRadius:99,height:5}}>
                        <div style={{background:T.accent,height:5,borderRadius:99,width:`${Math.min(100,((task.done||0)/task.total)*100)}%`,transition:"width .3s"}}/>
                      </div>
                      <input type="number" value={task.done||""} onChange={e=>updProg(task.id,e.target.value)} min={0} max={task.total} style={{width:48,background:T.bg,color:T.text,border:`1px solid ${T.border}`,borderRadius:5,padding:"2px 5px",fontSize:11,textAlign:"center"}}/>
                    </div>
                  </div>
                )}
                {task.note&&<div style={{fontSize:11,color:T.sub,marginTop:4}}>📝 {task.note}</div>}
              </div>
              <button onClick={()=>del(task.id)} style={{background:"none",color:T.sub,border:"none",cursor:"pointer",fontSize:16,padding:"0 3px",flexShrink:0,lineHeight:1}}>×</button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

          <div style={{fontSize:11,color:T.sub,marginBottom:7,fontWeight:600}}>MÀU CHỦ ĐẠO</div>
          <div style={{display:"flex",gap:9,flexWrap:"wrap"}}>
            {Object.entries(ACCENTS).map(([k,v])=>(
              <button key={k} onClick={()=>{setAccentKey(k);LS.set("accentKey",k);}} title={k} style={{width:32,height:32,borderRadius:"50%",background:v,border:accentKey===k?`3px solid ${T.text}`:"3px solid transparent",cursor:"pointer",transition:"transform .1s",transform:accentKey===k?"scale(1.25)":"scale(1)"}}/>
            ))}
          </div>
        </div>
      </div>

      {/* Telegram */}
      <div style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:14,padding:20,marginBottom:12}}>
        <div style={{fontWeight:700,fontSize:14,marginBottom:6}}>📱 Telegram Bot</div>
        <div style={{fontSize:11,color:T.sub,marginBottom:14,lineHeight:1.7,background:T.bg,padding:"10px 12px",borderRadius:8}}>
          <b style={{color:T.text}}>Hướng dẫn (5 phút):</b><br/>
          1️⃣ Telegram → tìm <b>@BotFather</b> → /newbot → lấy <b>Token</b><br/>
          2️⃣ Nhắn tin cho bot vừa tạo (bất kỳ)<br/>
          3️⃣ Tìm <b>@userinfobot</b> → /start → lấy <b>Chat ID</b><br/>
          4️⃣ Điền vào bên dưới → Test kết nối
        </div>
        <div style={{display:"grid",gap:9}}>
          <div>
            <div style={{fontSize:11,color:T.sub,marginBottom:3}}>Bot Token</div>
            <input value={tgToken} onChange={e=>{setTgToken(e.target.value);LS.set("tgToken",e.target.value);}} placeholder="1234567890:ABCdefGHI..." style={{width:"100%",background:T.bg,color:T.text,border:`1px solid ${T.border}`,borderRadius:8,padding:"7px 10px",fontSize:12}}/>
          </div>
          <div>
            <div style={{fontSize:11,color:T.sub,marginBottom:3}}>Chat ID</div>
            <input value={tgChat} onChange={e=>{setTgChat(e.target.value);LS.set("tgChat",e.target.value);}} placeholder="123456789" style={{width:"100%",background:T.bg,color:T.text,border:`1px solid ${T.border}`,borderRadius:8,padding:"7px 10px",fontSize:12}}/>
          </div>
          <button onClick={testTg} style={{background:T.accent,color:"#fff",border:"none",borderRadius:8,padding:"7px 14px",cursor:"pointer",fontWeight:700,fontSize:12,width:"fit-content"}}>🚀 Test kết nối Telegram</button>
        </div>
      </div>

      {/* Google Sheets */}
      <div style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:14,padding:20,marginBottom:12}}>
        <div style={{fontWeight:700,fontSize:14,marginBottom:6}}>📊 Google Apps Script (Lưu trữ vĩnh viễn)</div>
        <div style={{fontSize:11,color:T.sub,marginBottom:12,lineHeight:1.7,background:T.bg,padding:"10px 12px",borderRadius:8}}>
          <b style={{color:T.text}}>Hướng dẫn setup 1 lần:</b><br/>
          1️⃣ Mở <b>Google Sheets</b> mới → Extensions → <b>Apps Script</b><br/>
          2️⃣ Xoá code cũ → paste đoạn script bên dưới<br/>
          3️⃣ <b>Deploy</b> → New deployment → Web app → Execute as: <b>Me</b> → Who has access: <b>Anyone</b> → Deploy<br/>
          4️⃣ Copy URL → dán vào ô bên dưới
        </div>
        <div style={{background:T.bg,borderRadius:9,padding:12,marginBottom:10,fontSize:10,fontFamily:"monospace",color:T.sub,lineHeight:1.7,border:`1px solid ${T.border}`,maxHeight:160,overflow:"auto",whiteSpace:"pre"}}>
{`function doPost(e) {
  const data = JSON.parse(e.postData.contents);
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  let sh = ss.getSheetByName(data.sheet) 
          || ss.insertSheet(data.sheet);
  if (data.action === 'write') {
    sh.clearContents();
    sh.getRange(1,1,data.rows.length,
      data.rows[0].length).setValues(data.rows);
  }
  return ContentService
    .createTextOutput(JSON.stringify({ok:true}))
    .setMimeType(ContentService.MimeType.JSON);
}
function doGet(e) {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  const sh = ss.getSheetByName(e.parameter.sheet);
  if (!sh) return ContentService
    .createTextOutput(JSON.stringify({rows:[]}))
    .setMimeType(ContentService.MimeType.JSON);
  return ContentService
    .createTextOutput(JSON.stringify(
      {rows: sh.getDataRange().getValues()}))
    .setMimeType(ContentService.MimeType.JSON);
}`}
        </div>
        <input value={gasUrl} onChange={e=>{setGasUrl(e.target.value);LS.set("gasUrl",e.target.value);}} placeholder="https://script.google.com/macros/s/.../exec" style={{width:"100%",background:T.bg,color:T.text,border:`1px solid ${T.border}`,borderRadius:8,padding:"7px 10px",fontSize:12,marginBottom:9}}/>
        <button onClick={()=>showToast("URL đã lưu!")} style={{background:T.accent,color:"#fff",border:"none",borderRadius:8,padding:"7px 14px",cursor:"pointer",fontWeight:700,fontSize:12}}>Lưu URL</button>
      </div>

      {/* PWA hint */}
      <div style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:14,padding:20,marginBottom:12}}>
        <div style={{fontWeight:700,fontSize:14,marginBottom:10}}>📱 Cài lên iPhone như app thật</div>
        <div style={{fontSize:12,color:T.sub,lineHeight:1.8}}>
          1️⃣ Mở file này bằng <b style={{color:T.text}}>Safari</b> trên iPhone<br/>
          2️⃣ Nhấn nút <b style={{color:T.text}}>Share ⬆️</b> → <b style={{color:T.text}}>"Add to Home Screen"</b><br/>
          3️⃣ App xuất hiện trên màn hình chính như app thật ✅
        </div>
      </div>

      {/* Data */}
      <div style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:14,padding:20}}>
        <div style={{fontWeight:700,fontSize:14,marginBottom:12}}>🗄️ Quản Lý Dữ Liệu</div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          {[["finance","Tài chính"],["savings","Tiết kiệm"],["tasks","Công việc"]].map(([k,l])=>(
            <button key={k} onClick={()=>clearData(k)} style={{background:T.danger+"22",color:T.danger,border:`1px solid ${T.danger}44`,borderRadius:8,padding:"5px 12px",cursor:"pointer",fontSize:11,fontWeight:600}}>Xoá {l}</button>
          ))}
        </div>
        <div style={{fontSize:10,color:T.sub,marginTop:10,lineHeight:1.6}}>
          ⚠️ Dữ liệu lưu trong trình duyệt (localStorage). Xoá cache/cookies có thể mất data.<br/>
          ✅ Kết nối Google Sheets ở trên để backup vĩnh viễn.
        </div>
      </div>
    </div>
  );
}

// ══ RENDER ════════════════════════════════════════════════
const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
